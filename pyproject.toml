[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rkc"
version = "0.1.0.dev0"
description = "Degeneracy-aware special-function routing compiler (Ramanujan Kernel Compiler)"
readme = "rkc/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jouni Helminen", email = "jouni@helminen.co" },
]
keywords = ["special-functions", "modular-forms", "mock-theta", "ramanujan", "high-precision", "mpmath"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.13",
    "mpmath>=1.3",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev  = ["pytest>=8"]

[project.scripts]
rkc = "rkc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rkc*"]
exclude = ["analysis*", "corpora*", "diary*", "insights*", "manifest*", "sota_comparisons*", "downloaded-pdfs*", "chatgpt-pro-mining*"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that exercise the full benchmark suite (~5-10s)",
]
