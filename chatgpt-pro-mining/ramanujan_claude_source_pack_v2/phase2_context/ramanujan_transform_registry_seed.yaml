  input_fingerprint: "quadratic exponential phase with rational coefficient"
  output_representation: "finite Gauss sum / character sum with residue-class structure"
  validity_conditions:
    - "Phase is exactly rational or approximation error is bounded"
    - "Denominator class and parity handled explicitly"
  degeneracy_modes:
    - "Rational snapping changes the problem outside tolerance"
    - "Certain denominator classes produce cancellation/silent zero"
    - "Aliasing if residue-period not handled"
  certificate_type: "exact finite sum plus perturbation bound for snapping"
  error_bound: "Problem-specific snapping residual bound"
  direct_baseline: "Direct oscillatory sum/integral or generic quadrature"
  benchmark_cases: ["safe rational phase", "near-rational phase", "q ≡ 2 mod 4 style failure control"]
  known_implementations: ["number theory/CAS Gauss sum routines"]
  sota_notes: "Potential short note only if failure-mode framing is not already standard."
  source_examples: ["Ramanujan sums and modular equation motifs"]
  tests:
    positive: ["small rational quadratic phases"]
    negative: ["irrational phase with no safe approximation"]
    degenerate: ["denominator-class silent cancellation"]
  status: seeded

