- transform_id: ramanujan_sum_periodic_basis
  name: Ramanujan-sum periodicity basis
  operator_tags: [RAMANUJAN_SUM_PERIODICITY, FINITE_GAUSS_COLLAPSE]
  input_fingerprint: "integer-indexed signal with arithmetic/divisor periodic structure"
  output_representation: "finite expansion in Ramanujan sums c_q(n)"
  validity_conditions:
    - "Signal domain is integer-indexed or can be mapped cleanly to integer periods"
    - "Candidate periods q are bounded or sparse"
  degeneracy_modes:
    - "Ordinary Fourier basis may dominate for non-arithmetic periods"
    - "Noisy/missing data may break exact orthogonality"
    - "Large q dictionary can be expensive"
  certificate_type: "projection residual / held-out reconstruction error"
  error_bound: "Empirical for noisy signals; exact for clean finite dictionary cases"
  direct_baseline: "DFT/Fourier feature regression"
  benchmark_cases: ["clean hidden q atoms", "noisy integer-period signal", "non-integer-period control"]
  known_implementations: ["Ramanujan filter bank literature", "custom implementation"]
  sota_notes: "Existing signal-processing field; novelty must be benchmark/integration/corpus link."
  source_examples: ["Ramanujan finite trigonometric sums paper"]
  tests:
    positive: ["signals from c_6, c_10, c_15"]
    negative: ["irrational-period sinusoid"]
    degenerate: ["heavy noise with sparse observations"]
  status: seeded

- transform_id: finite_gauss_sum_rational_phase
  name: Finite Gauss-sum collapse under rational phase
