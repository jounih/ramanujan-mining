# Seed transform registry for Ramanujan Phase 2.
# These are not all novel. They are starter entries for a degeneracy-aware recognizer/registry.

- transform_id: theta_gaussian_jacobi_dual
  name: Gaussian theta reciprocal transform
  operator_tags: [POISSON_THETA_DUAL, MODULAR_TRANSFORM]
  input_fingerprint: "sum over integers of exp(-beta*(n+a)^2) or close theta kernel"
  output_representation: "dual theta series with reciprocal beta"
  validity_conditions:
    - "Gaussian/quadratic lattice kernel recognized exactly or with bounded perturbation"
    - "Positive real beta for simplest route; complex cases require domain checks"
  degeneracy_modes:
    - "Direct series may be faster for intermediate beta"
    - "Complex beta or shifts can cause cancellation/precision loss"
    - "Approximate recognition of a non-quadratic kernel is unsafe"
  certificate_type: "tail bound on direct and dual Gaussian series"
  error_bound: "Use monotone Gaussian tail / erfc-style bound in selected domain"
  direct_baseline: "Truncated direct integer sum"
  benchmark_cases:
    - "Small beta where dual is short"
    - "Large beta where direct is short"
    - "Intermediate beta where router must compare costs"
  known_implementations: ["mpmath theta functions", "Arb/FLINT style ball arithmetic where available"]
  sota_notes: "Classical identity; novelty only in safe routing and registry integration."
  source_examples: ["Ramanujan theta/q-series motifs; notebook/lost notebook pages TBD"]
  tests:
    positive: ["beta=1e-8", "beta=0.01", "beta=100"]
    negative: ["kernel exp(-beta*n^4)"]
    degenerate: ["complex beta near imaginary axis", "beta near transition where direct and dual tie"]
  status: seeded

- transform_id: dedekind_eta_s_transform
  name: Dedekind eta S-transform / q-product reciprocal switch
  operator_tags: [MODULAR_TRANSFORM, SERIES_TO_PRODUCT, PRODUCT_TO_SERIES]
  input_fingerprint: "eta-like infinite q-product or partition generating function"
  output_representation: "reciprocal modular parameter product/series with prefactor"
  validity_conditions:
    - "Input is eta or eta-product with known modular weight/multiplier"
    - "q inside unit disk or analytically continued with domain metadata"
  degeneracy_modes:
    - "Multiplier/cusp data missing for high-level eta-products"
    - "Bad cusp makes transformed representation not cheaper"
    - "Precision loss from prefactor or cancellation"
  certificate_type: "q-product truncation bound plus modular validity check"
  error_bound: "Product tail bound in chosen q-domain"
  direct_baseline: "Direct q-product expansion/truncation"
  benchmark_cases: ["Partition generating function", "Eta-products at near-boundary q", "High-level eta-product control"]
  known_implementations: ["Sage modular forms", "PARI/GP eta/q-series", "Arb/FLINT where applicable"]
  sota_notes: "Classical; useful as registry entry with cusp/failure metadata."
  source_examples: ["Ramanujan q-products and partition identities"]
  tests:
    positive: ["q close to 1 on real axis", "simple eta"]
    negative: ["generic product not eta-like"]
    degenerate: ["high-level cusp without multiplier table"]
  status: seeded

- transform_id: partition_pentagonal_recurrence
  name: Partition coefficient recurrence via pentagonal theorem
  operator_tags: [RECURRENCE_COMPILER, PRODUCT_TO_SERIES, CONGRUENCE_SIEVE]
  input_fingerprint: "1/prod_{n>=1}(1-q^n) coefficient query"
  output_representation: "Euler pentagonal recurrence for p(n)"
  validity_conditions:
    - "Exact partition generating function recognized"
    - "Integer n >= 0"
  degeneracy_modes:
    - "Specialized H-R-R algorithms dominate for huge n"
    - "Generic partition variants require different recurrence"
  certificate_type: "integer recurrence equality and optional congruence checks"
  error_bound: "Exact integer recurrence; no truncation error if computed exactly"
  direct_baseline: "Coin-change dynamic programming or product expansion"
  benchmark_cases: ["n=250", "n=1000", "n=10000"]
  known_implementations: ["many CAS", "Sage", "PARI/GP", "FLINT/Arb for advanced partition methods"]
  sota_notes: "Known; use as baseline for representation-switching compiler."
  source_examples: ["Ramanujan partition papers and congruences"]
  tests:
    positive: ["p(0)..p(1000)"]
    negative: ["restricted partitions with different product"]
    degenerate: ["very large n where H-R-R should be preferred"]
  status: seeded

